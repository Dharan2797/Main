{% extends "base.html" %}
{% block title %}{{ title }} – FileVault{% endblock %}
{% block body %}
<div class="login-page">
  <div class="login-card" style="text-align:center;">
    <div class="login-logo">
      <div class="big-icon">⚠️</div>
      <h1>{{ code }} - {{ title }}</h1>
      <p>{{ message }}</p>
    </div>
    <a href="{{ url_for('index') }}" class="btn btn-primary" style="width:100%;justify-content:center;padding:11px;margin-top:8px;">🏠 Go to FileVault</a>
  </div>
</div>
{% endblock %}
