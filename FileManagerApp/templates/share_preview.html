{% extends "base.html" %}
{% block title %}Preview {{ filename }} – FileVault{% endblock %}
{% block body %}
<div class="app-layout" style="display: flex; justify-content: center; align-items: flex-start; padding: 40px 20px; min-height: 100vh; background: var(--bg);">
  <div style="width: 100%; max-width: 900px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); overflow: hidden; padding: 28px;">
    
    <div style="display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); padding-bottom: 20px; margin-bottom: 24px; gap: 20px; flex-wrap: wrap;">
      <div style="display: flex; align-items: center; gap: 14px;">
        <span style="font-size: 2.5rem;">📄</span>
        <div>
          <h1 style="font-size: 1.6rem; font-weight: 700; margin: 0; color: var(--fg);">{{ filename }}</h1>
          <p style="font-size: 0.85rem; color: var(--muted); margin: 4px 0 0 0;">Public Shared File (Read-Only Preview)</p>
        </div>
      </div>
    </div>

    <!-- Preview Container -->
    <div id="previewBody" style="background: rgba(0,0,0,0.2); padding: 20px; border-radius: 12px; border: 1px solid var(--border); display: flex; justify-content: center; align-items: center; min-height: 400px; overflow: auto; width: 100%;">
      <p style="color:var(--muted)">Loading preview...</p>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const url = "{{ url_for('share_file_preview', token=token) }}";
  const name = "{{ filename }}";
  const body = document.getElementById('previewBody');
  const ext  = name.split('.').pop().toLowerCase();
  
  if (['png','jpg','jpeg','gif','svg','webp','bmp'].includes(ext)) {
    body.innerHTML = '<img src="'+url+'" style="max-width:100%;max-height:75vh;border-radius:8px;" />';
  } else if (['mp4','webm','mov'].includes(ext)) {
    body.innerHTML = '<video controls style="max-width:100%;max-height:75vh;width:100%;"><source src="'+url+'"></video>';
  } else if (['mp3','wav','ogg','flac'].includes(ext)) {
    body.innerHTML = '<audio controls style="width:100%;"><source src="'+url+'"></audio>';
  } else if (ext === 'pdf') {
    body.innerHTML = '<iframe src="'+url+'" style="width:100%;height:75vh;border:none;border-radius:8px;"></iframe>';
  } else {
    fetch(url).then(r => {
      if (!r.ok) throw new Error();
      return r.text();
    }).then(t => {
      body.innerHTML = '<pre style="width:100%; text-align:left; white-space:pre-wrap; font-family:monospace; font-size:0.9rem; color:var(--fg); margin:0;">'+t.replace(/&/g, '&amp;').replace(/</g,'&lt;').replace(/>/g, '&gt;')+'</pre>';
    }).catch(() => {
      body.innerHTML = '<p style="color:var(--muted)">Preview not available for this file type.</p>';
    });
  }
});
</script>
{% endblock %}
